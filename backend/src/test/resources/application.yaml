spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wrong_question_system_test
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    baseline-on-migrate: false
    baseline-version: 1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  review:
    zone-id: ${APP_REVIEW_ZONE_ID:Asia/Shanghai}
