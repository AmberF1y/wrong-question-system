spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

  datasource:
    url: jdbc:mysql://localhost:3306/wrong_question_system_test
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    baseline-on-migrate: false
    baseline-version: 1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  rag:
    model: test-rag
    embedding-enabled: false
    embedding-model: test-embedding
    concurrency: 1
    max-questions: 5000
    max-chunks: 10000
    chunk-size: 900
    chunk-overlap: 100
    top-k: 6
    embedding-batch-size: 16
    embedding-batches-per-request: 3
    minimum-similarity: 0.45
  ai:
    mode: disabled
    base-url: ''
    api-key: ''
    model: test-vision
    timeout-seconds: 5
    concurrency: 2
    max-attempts: 3
    max-manual-retries: 2
    daily-call-limit: 20
    worker-enabled: false
    max-knowledge-points: 300
    response-format: json_object
  review:
    zone-id: ${APP_REVIEW_ZONE_ID:Asia/Shanghai}
  storage:
    question-image-directory: ${APP_QUESTION_IMAGE_DIRECTORY:./target/test-question-images}
