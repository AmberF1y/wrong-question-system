spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

  datasource:
    url: jdbc:mysql://localhost:3306/wrong_question_system
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  review:
    zone-id: ${APP_REVIEW_ZONE_ID:Asia/Shanghai}
  storage:
    question-image-directory: ${APP_QUESTION_IMAGE_DIRECTORY:./data/question-images}
